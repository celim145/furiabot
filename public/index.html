<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">

    <title>FURIA ChatBot</title>
</head>

<body class="bg-dark text-light"> <!-- Deixa o fundo escuro e o texto claro -->
    <h1>ChatBot FURIA</h1>

    <div class="container  mt-4">
        <!-- Texto grande e negrito -->

        <div id="chat" class="rounded">
            <!-- Adicionando bordas arredondadas e fundo -->
        </div>

        <div class="message-box">
            <textarea id="input" rows="2" placeholder="Digite sua mensagem..."></textarea>
            <button id="send"><i class="fas fa-paper-plane"></i></button> <!-- Botão de envio -->
        </div>

        <!-- Botão amarelo estilizado -->
    </div>

    <script src="script.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.5/purify.min.js"></script>
</body>


</html>
